services:
  mysql:
    image: mysql:8.0
    container_name: parking-db
    environment:
      MYSQL_DATABASE: parkingdb
      MYSQL_USER: parkinguser
      MYSQL_PASSWORD: parkingpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: parking-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/parkingdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: parkinguser
      SPRING_DATASOURCE_PASSWORD: parkingpassword
    depends_on:
      mysql:
        condition: service_healthy